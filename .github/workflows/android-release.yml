name: Android Auto Release & Publish

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Direct Publish to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating new debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android" -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore (Secret or Auto-Generated CI Key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release_keys
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release_keys/upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release_keys/upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          else
            echo "Generating official signed release keystore for CI..."
            keytool -genkeypair -v -keystore release_keys/upload-key.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "androidrelease" -keypass "androidrelease" \
              -dname "CN=GamePrep, OU=Mobile, O=AIStudio, L=Jakarta, ST=Jakarta, C=ID"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release_keys/upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=androidrelease" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidrelease" >> $GITHUB_ENV
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release Google Play Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect & Name Release Artifacts
        id: artifacts
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "$GITHUB_REF" ]; then
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

          # Copy and rename Release APK
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "dist/GamePrep-${TAG_NAME}-release.apk"
          fi

          # Copy and rename Release AAB
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/*.aab "dist/GamePrep-${TAG_NAME}-release.aab"
          fi

          # Copy and rename Debug APK for quick testing
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk "dist/GamePrep-${TAG_NAME}-debug.apk"
          fi

          echo "Files to upload:"
          ls -la dist/

      - name: Publish Direct to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag_name }}
          name: "Game Prep ${{ steps.artifacts.outputs.tag_name }} (Release Otomatis)"
          body: |
            ## 🎮 Game Prep - Rilis Otomatis (${{ steps.artifacts.outputs.tag_name }})
            
            Build Android produksi murni non-root, optimal untuk perangkat RAM 2 GB seperti Xiaomi Redmi 9A.
            
            ### 📦 File Unduhan:
            - **GamePrep-${{ steps.artifacts.outputs.tag_name }}-release.apk**: APK Produksi yang telah ditandatangani (Signed Release APK).
            - **GamePrep-${{ steps.artifacts.outputs.tag_name }}-release.aab**: Google Play App Bundle resmi untuk distribusi Google Play Store.
            - **GamePrep-${{ steps.artifacts.outputs.tag_name }}-debug.apk**: APK Debug untuk pengujian langsung tanpa verifikasi sertifikat produksi.
            
            ### ✨ Fitur Termasuk:
            - Pure Non-Root & Package Visibility resmi Android 10 - 14+.
            - Monitor RAM hardware akurat dari `ActivityManager.MemoryInfo`.
            - Persiapan terpandu (Guided Preparation) resmi via Info Aplikasi sistem.
            - Sistem perlindungan otomatis untuk Telepon, SMS, Jam Alarm, dan Keyboard sistem.
            - Pengaturan profil game lokal via Jetpack DataStore Preferences.
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
